<app-hero />

<app-skills />

<section class="projects-section" id="projects" aria-labelledby="projects-title">
  <div class="container">
  <div class="section-header">
    <p class="section-eyebrow">02 / Selected work</p>
    <h2 class="section-title" id="projects-title">Featured <span>Projects</span></h2>
    <p class="section-subtitle">A collection of my recent work and personal projects.</p>
  </div>
  
  @if (isLoading()) {
    <div class="loading-state" role="status" aria-busy="true">
      <div class="spinner"></div>
      <p>Loading projects...</p>
    </div>
  } @else {
    <app-project-grid 
      [projects]="projects()" 
      (projectClick)="onProjectClick($event)" />
  }
  </div>
</section>

<app-contact />

@if (isModalOpen() && selectedProjectId()) {
  <app-project-detail 
    [projectId]="selectedProjectId()!" 
    (close)="closeModal()" />
}
